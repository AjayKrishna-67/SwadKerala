name: RemixSite

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/Web_Pro/SwadKerala

            git reset --hard
            git clean -fd
            git pull origin main

            npm install
            npm run build

            pm2 restart swadkerala || pm2 start npm --name swadkerala -- start
